name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foreman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foreman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foreman

    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@foreman.dev"
          git config --global user.name "Foreman CI"
          git config --global init.defaultBranch main

      # The JujutsuBackend suites skipIf away when `jj` is absent, so without this
      # 68 tests silently report as passing runs. That is how a git-town config bug
      # shipped in jujutsu-backend.ts unnoticed while its identical sibling in
      # git-backend.ts was caught: only the git suite actually ran.
      - name: Install jj (Jujutsu) for VCS backend tests
        env:
          JJ_VERSION: 0.43.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jj.tar.gz \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf /tmp/jj.tar.gz -C /tmp ./jj
          install -m 0755 /tmp/jj /usr/local/bin/jj
          jj --version

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Write repo .env for integration tests
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run CI tests
        run: npm run test:ci
