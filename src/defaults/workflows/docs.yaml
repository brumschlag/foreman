# Docs / lightweight-fix workflow: develop → finalize → create-pr
#
# Minimal end-to-end loop that installs workspace deps, makes a self-contained
# change, commits it on a foreman/<task> branch, and opens a PR for review.
# Deliberately omits the test/qlty/cli-review/pr-review gates so it can complete
# for low-risk, self-contained fixes (docs, lint, comments) that don't require
# building or testing the whole app.
#
# setup uses `npm ci` (lockfile-exact) so ALL workspaces install — including the
# frontend workspace, whose .npmrc (legacy-peer-deps) `npm install` ignores from
# the repo root, leaving frontend deps unresolved.
#
# merge: manual — foreman opens the PR and stops; a human reviews/merges.
# Auto-selected when bead type is "docs".

name: docs
task_type: docs
merge: pr
setup:
  - command: npm ci --no-audit
    description: Install all workspace dependencies (lockfile-exact)
    failFatal: true

phases:
  - name: prepare-worktree
    action: prepare-worktree

  - name: setup-workspace
    action: setup-workspace

  - name: write-task-context
    action: write-task-context

  # ── Phase 1: develop ────────────────────────────────────────────────────
  # The agent makes the change based on the task title/description.
  - name: develop
    action: prompt-agent
    prompt: developer.md
    tools:
      allowed: [Agent, Bash, Edit, Glob, Grep, Read, TaskOutput, TaskStop, TodoWrite, WebFetch, WebSearch, Write]
    models:
      default: bedrock-gateway/claude-sonnet-46
      P0: bedrock-gateway/claude-opus
      P4: bedrock-gateway/claude-haiku
    maxTurns: 80
    retryAfterCooldown: true
    artifact: "{task.projectReportsDir}/DEVELOPER_REPORT.md"
    mail:
      onStart: true
      onComplete: true
    files:
      reserve: true
      leaseSecs: 300

  # ── Phase 2: finalize ───────────────────────────────────────────────────
  # Commits the change on a foreman/<task> branch and validates the diff.
  - name: finalize
    action: finalize
    builtin: true
    artifact: "{task.projectReportsDir}/FINALIZE_VALIDATION.md"
    maxTurns: 30
    contract:
      policy:
        finalizeValidation: true
        skipDeveloperRetryOnUnrelatedFinalizeFailure: true
        terminalOnFailExhausted: true
    verdict: true
    retryWith: develop
    retryOnFail: 2
    mail:
      onStart: true
      onComplete: true
      onFail: develop

  # ── Phase 3: create-pr ──────────────────────────────────────────────────
  # Opens the PR and stops (merge: manual). Human reviews and merges.
  - name: create-pr
    action: create-pr
    builtin: true
    artifact: "{task.projectReportsDir}/PR_METADATA.json"
    mail:
      onStart: true
      onComplete: true
